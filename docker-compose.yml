services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_ADSENSE_CLIENT_ID: ${VITE_ADSENSE_CLIENT_ID:-}
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/data
    # Port yalnızca sunucunun kendisine (127.0.0.1) açılır; internetten gelen trafik
    # Caddy (HTTPS) üzerinden geçer. Cloudflare Tunnel da localhost:3000'e bağlanabilir.
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
